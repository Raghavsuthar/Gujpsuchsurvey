<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EEF2FF" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="brandIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <filter id="cardShadow" x="-10" y="-10" width="1220" height="650" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle grid/pattern lines for academic rigor feel -->
  <g opacity="0.4" stroke="#E2E8F0" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630" stroke-dasharray="4 8" />
    <line x1="1120" y1="0" x2="1120" y2="630" stroke-dasharray="4 8" />
    <line x1="0" y1="80" x2="1200" y2="80" stroke-dasharray="4 8" />
    <line x1="0" y1="550" x2="1200" y2="550" stroke-dasharray="4 8" />
  </g>

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20" stroke="#CBD5E1" stroke-width="2" fill="none" />

  <!-- Decorative soft ambient glow right-hand side -->
  <circle cx="1020" cy="280" r="220" fill="#E0E7FF" opacity="0.6" />
  <circle cx="1090" cy="360" r="140" fill="#CCFBF1" opacity="0.4" />

  <!-- Content Container (Left to Center) -->
  <!-- Header Pill Badge -->
  <g transform="translate(80, 75)">
    <rect width="470" height="38" rx="19" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5" />
    <!-- Check Shield Icon -->
    <path d="M22 13.5L28 11V19C28 22.8 25.4 26.4 22 27.5C18.6 26.4 16 22.8 16 19V11L22 13.5Z" fill="#1E3A8A" />
    <path d="M20 19.2L18.4 17.6L17.2 18.8L20 21.6L26.5 15.1L25.3 13.9L20 19.2Z" fill="#FFFFFF" />
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1E3A8A" letter-spacing="0.5">IEC ETHICS VERIFIED &amp; MODERATED DIRECTORY</text>
  </g>

  <!-- Brand Title -->
  <g transform="translate(80, 175)">
    <!-- Brand Icon -->
    <rect width="64" height="64" rx="16" fill="url(#brandIconGrad)" />
    <!-- Brain / Psychology Icon -->
    <path d="M24 38C22.3 38 20.8 37.4 19.6 36.2C18.4 35 17.8 33.5 17.8 31.8C17.8 30.5 18.2 29.3 19 28.3C19.8 27.3 20.8 26.7 22.1 26.4C22.2 24.6 23 23 24.3 21.8C25.7 20.6 27.3 20 29.1 20C29.6 20 30.1 20.1 30.6 20.2C31.5 18.9 32.7 17.9 34.2 17.3C35.7 16.6 37.3 16.5 38.9 17C39.4 15.8 40.3 14.8 41.5 14.1C42.7 13.4 44 13 45.4 13C47.2 13 48.7 13.6 49.9 14.8C51.1 16 51.7 17.5 51.7 19.3V20.2C52.7 20.6 53.6 21.3 54.2 22.2C54.8 23.1 55.2 24.2 55.2 25.4C55.2 26.3 55 27.1 54.6 27.9C55.7 28.6 56.4 29.6 56.8 30.7C57.2 31.8 57.1 33 56.7 34.1C56.2 35.2 55.5 36 54.5 36.6C54.3 37.9 53.6 39 52.6 39.8C51.6 40.6 50.4 41 49.1 41C48.2 41 47.4 40.8 46.6 40.4C45.8 41.5 44.7 42.4 43.5 42.9C42.2 43.4 40.9 43.5 39.6 43.1C38.6 44.3 37.3 45.1 35.8 45.6C34.3 46.1 32.8 46.1 31.4 45.6C30.1 46.5 28.6 47 27 47C25.1 47 23.4 46.3 22.1 45C20.8 43.7 20.1 42 20.1 40.1C20.1 39.4 20.2 38.7 20.5 38H24Z" fill="#FFFFFF" opacity="0.95" />
    
    <text x="80" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
      GujPsych<tspan fill="#1E3A8A">Survey</tspan>
    </text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#0F172A" line-height="1.2">
    Psychiatry &amp; Mental Health Research Directory
  </text>

  <!-- Gujarati Vernacular Subline -->
  <text x="80" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Gujarati', sans-serif" font-size="23" font-weight="600" fill="#1E3A8A">
    ગુજરાતમાં માનસિક સ્વાસ્થ્ય સંશોધન માટેનું વિશ્વસનીય અને નૈતિક મંચ
  </text>

  <!-- Description Body -->
  <text x="80" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#475569">
    A curated, non-commercial registry connecting researchers, residents, and public
  </text>
  <text x="80" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#475569">
    participants with IEC-cleared surveys and validated psychological instruments.
  </text>

  <!-- Feature Trust Pills Row -->
  <g transform="translate(80, 440)">
    <!-- Pill 1: Ethics -->
    <rect x="0" y="0" width="235" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <circle cx="22" cy="21" r="9" fill="#EEF2FF" />
    <path d="M19 21.2L20.8 23L25 18.8" stroke="#1E3A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#1E3A8A">ICMR 2017 Compliant</text>

    <!-- Pill 2: Zero Custody -->
    <rect x="250" y="0" width="225" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <circle cx="272" cy="21" r="9" fill="#CCFBF1" />
    <path d="M269 21.2L270.8 23L275 18.8" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="288" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0F766E">Zero Data Harvesting</text>

    <!-- Pill 3: Languages -->
    <rect x="490" y="0" width="260" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <circle cx="512" cy="21" r="9" fill="#FEF3C7" />
    <text x="506" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#92400E">A</text>
    <text x="528" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#334155">English · ગુજરાતી · हिन्दी</text>
  </g>

  <!-- Right Graphic Illustration (Academic Clipboard & Security Seal) -->
  <g transform="translate(850, 160)">
    <!-- Clipboard Backing -->
    <rect x="0" y="20" width="240" height="310" rx="20" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="3" filter="url(#cardShadow)" />
    
    <!-- Clipboard Clip -->
    <rect x="75" y="6" width="90" height="32" rx="8" fill="#1E3A8A" />
    <rect x="95" y="14" width="50" height="12" rx="4" fill="#EEF2FF" />

    <!-- Simulated Document Content Lines -->
    <rect x="30" y="65" width="130" height="14" rx="4" fill="#1E3A8A" opacity="0.9" />
    <rect x="30" y="90" width="80" height="10" rx="3" fill="#0F766E" opacity="0.8" />
    <line x1="30" y1="115" x2="210" y2="115" stroke="#E2E8F0" stroke-width="2" />

    <!-- Check items on document -->
    <!-- Item 1 -->
    <rect x="30" y="132" width="16" height="16" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5" />
    <path d="M34 140L37 143L43 137" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="56" y="136" width="140" height="8" rx="2" fill="#94A3B8" />

    <!-- Item 2 -->
    <rect x="30" y="162" width="16" height="16" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5" />
    <path d="M34 170L37 173L43 167" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="56" y="166" width="125" height="8" rx="2" fill="#94A3B8" />

    <!-- Item 3 -->
    <rect x="30" y="192" width="16" height="16" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5" />
    <path d="M34 200L37 203L43 197" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="56" y="196" width="135" height="8" rx="2" fill="#94A3B8" />

    <!-- Stamp/Seal at bottom of clipboard -->
    <g transform="translate(145, 230)">
      <circle cx="35" cy="35" r="35" fill="#EEF2FF" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="3 3" />
      <circle cx="35" cy="35" r="28" fill="#1E3A8A" />
      <path d="M26 35L32 41L45 28" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Footer Link/Domain -->
  <g transform="translate(80, 532)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748B">
      Open Academic Protocol Repository · Hosted via GitHub Pages
    </text>
  </g>
</svg>
